<!DOCTYPE html>
<!-- saved from url=(0064)file:///Users/cic/Documents/allygo/lantern-festival-checkin.html -->
<html lang="zh-CN"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1A1A2E">
  <title>海灯节签到</title>
  <style>
    :root{--night:#1A1A2E;--gold:#F5D98C;--jade:#A8D8C8;--ink:#11121f;--muted:#aaa8ad}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#0d0e1c}
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#f9f3df;display:flex;justify-content:center}
    button{font:inherit}.app{position:relative;width:min(100%,390px);min-height:100svh;overflow:hidden;background:var(--night);isolation:isolate;padding-bottom:124px}
    .sky{position:absolute;inset:0;z-index:-3;background:radial-gradient(circle at 80% 13%,#3b3454 0,transparent 24%),radial-gradient(circle at 20% 32%,#25384a 0,transparent 30%),linear-gradient(180deg,#1a1a2e 0%,#20213a 42%,#151727 100%)}
    .stars{position:absolute;inset:0;z-index:-2;opacity:.58;background-image:radial-gradient(circle,#f5d98c 0 1px,transparent 1.2px),radial-gradient(circle,#a8d8c8 0 1px,transparent 1.4px),radial-gradient(circle,#fff 0 .7px,transparent 1px);background-size:83px 97px,127px 139px,57px 71px;background-position:9px 12px,52px 28px,21px 42px;animation:drift 18s linear infinite}
    @keyframes drift{to{background-position:92px 109px,179px 167px,78px 113px}}
    .mountains{position:absolute;z-index:-1;top:120px;left:-40px;width:470px;height:210px;opacity:.75;background:linear-gradient(150deg,transparent 36%,#151a2d 36.3% 56%,transparent 56.3%),linear-gradient(30deg,transparent 36%,#20283c 36.3% 58%,transparent 58.3%);filter:drop-shadow(0 -1px 0 rgba(168,216,200,.16))}
    .lantern{position:absolute;z-index:1;width:24px;height:32px;border:1px solid rgba(245,217,140,.72);border-radius:46% 46% 38% 38%;background:radial-gradient(circle at 50% 40%,#fff3aa 0,#e6a05e 28%,#8b4a3e 70%);box-shadow:0 0 18px #f5bc7080}
    .lantern:before,.lantern:after{content:"";position:absolute;left:50%;width:1px;background:#f5d98c}.lantern:before{height:30px;bottom:100%}.lantern:after{height:14px;top:100%}
    .l1{top:106px;left:30px;transform:scale(.7)}.l2{top:82px;right:37px;transform:scale(.46)}.l3{top:228px;right:14px;transform:scale(.34)}
    .topbar{height:64px;padding:calc(10px + env(safe-area-inset-top)) 14px 8px;display:grid;grid-template-columns:42px 1fr 42px;align-items:center;border-bottom:1px solid rgba(245,217,140,.17);background:linear-gradient(#151527df,#191a2dcc);backdrop-filter:blur(8px)}
    .icon-btn{display:grid;place-items:center;width:38px;height:38px;padding:0;border:0;background:transparent;color:var(--gold);cursor:pointer;border-radius:50%}.icon-btn:active{background:#ffffff10}.topbar h1{margin:0;text-align:center;font:600 18px/1.2 Georgia,"Songti SC",serif;letter-spacing:3px;color:#fff3cb;text-shadow:0 1px 8px #f5d98c66}
    .hero{position:relative;text-align:center;padding:43px 24px 22px}.hero:after{content:"";display:block;width:210px;height:1px;margin:22px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent);box-shadow:0 0 5px #f5d98c}
    .kicker{margin:0 0 8px;color:var(--jade);font-size:12px;letter-spacing:5px}.hero h2{margin:0;color:var(--gold);font:700 30px/1.25 Georgia,"Songti SC",serif;letter-spacing:1px;text-shadow:0 2px 0 #5b4428,0 0 18px #f5d98c45}.subtitle{margin:11px 0 0;color:#e9e4dc;font-size:13px;letter-spacing:1px}.countdown{margin:18px auto 0;width:max-content;padding:7px 14px;border:1px solid rgba(168,216,200,.3);border-radius:20px;color:#d9ece7;background:#10152688;font-size:12px;font-variant-numeric:tabular-nums}.countdown strong{color:var(--gold);font-weight:600;letter-spacing:.5px}
    .content{padding:0 16px}.status{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 13px;font-family:Georgia,"Songti SC",serif}.status span:first-child{font-size:18px;color:#fff4d4}.status b{font-weight:500;color:var(--jade);font-size:13px}.status i{color:var(--gold);font-style:normal}
    .rewards-shell{position:relative;padding:12px 0 14px;border-top:1px solid #f5d98c4d;border-bottom:1px solid #f5d98c2e}.rewards-shell:before,.rewards-shell:after{content:"◆";position:absolute;top:-8px;color:var(--gold);font-size:10px}.rewards-shell:before{left:0}.rewards-shell:after{right:0}
    .rewards{display:grid;grid-template-columns:repeat(7,96px);gap:9px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:none}.rewards::-webkit-scrollbar{display:none}
    .card{position:relative;scroll-snap-align:start;height:160px;overflow:hidden;border:1px solid #75716e;border-radius:12px;background:linear-gradient(160deg,#3a3b48,#282936 60%,#22232f);box-shadow:inset 0 1px 0 #ffffff18,0 7px 16px #08091266;text-align:center;transition:.35s ease}.card.done,.card.today{border-color:var(--gold);background:linear-gradient(160deg,#5b513b,#34343e 60%,#262631);box-shadow:inset 0 0 22px #f5d98c1f,0 0 10px #f5d98c24}.card.today{transform:translateY(-3px)}
    .day{height:29px;display:grid;place-items:center;border-bottom:1px solid #ffffff12;color:#d5d0c5;font-size:11px}.done .day,.today .day{color:#291f13;background:linear-gradient(90deg,#c7a557,#f5d98c,#c9a95f);font-weight:700}
    .reward-icon{height:77px;display:grid;place-items:center;filter:drop-shadow(0 3px 3px #0008)}.reward-icon svg{width:52px;height:52px}.reward-name{min-height:30px;padding:0 5px;color:#e8e5dc;font-size:10px;line-height:1.35}.quantity{color:var(--gold);font:bold 12px Georgia,serif}.check{position:absolute;right:5px;bottom:5px;display:grid;place-items:center;width:21px;height:21px;border:1px solid #e1c375;border-radius:50%;background:#9e783c;color:white;font-size:14px;box-shadow:0 0 7px #f5d98c88}.card:not(.done):not(.today) .check{display:none}
    .hint{text-align:center;margin:17px 0 0;color:#888895;font-size:11px;letter-spacing:.4px}.rules{margin:19px 0 0;padding:14px 16px;border:1px solid #a8d8c823;border-radius:12px;background:#11152673;color:#aaaab2;font-size:11px;line-height:1.8}.rules strong{display:block;margin-bottom:3px;color:var(--jade);font:500 13px Georgia,"Songti SC",serif;letter-spacing:2px}
    .bottom{position:fixed;z-index:10;bottom:0;width:min(100%,390px);padding:15px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#121322 26%);pointer-events:none}.checkin{position:relative;width:100%;height:54px;border:1px solid #fff1b7;border-radius:27px;background:linear-gradient(180deg,#ffe9a7,#e1b95b 53%,#b88838);color:#392713;font-weight:700;letter-spacing:5px;box-shadow:inset 0 1px 0 #fff9da,0 0 0 3px #e7be5b33,0 0 21px #f5d98c4f;cursor:pointer;pointer-events:auto;transition:.3s}.checkin:before,.checkin:after{content:"◆";position:absolute;top:17px;font-size:11px;color:#7e602d}.checkin:before{left:25px}.checkin:after{right:25px}.checkin:active{transform:scale(.985)}.checkin:disabled{border-color:#6f707b;background:linear-gradient(#666875,#484a56);color:#bbbcc2;box-shadow:inset 0 1px #ffffff18;cursor:default}.toast{position:fixed;z-index:20;left:50%;bottom:103px;transform:translate(-50%,14px);padding:9px 18px;border:1px solid #f5d98c77;border-radius:22px;background:#10111fee;color:var(--gold);font-size:13px;opacity:0;pointer-events:none;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media (prefers-reduced-motion:reduce){.stars{animation:none}*{scroll-behavior:auto!important}}
  </style>
</head>
<body>
<main class="app">
  <div class="sky"></div><div class="stars"></div><div class="mountains"></div><i class="lantern l1"></i><i class="lantern l2"></i><i class="lantern l3"></i>
  <header class="topbar">
    <button class="icon-btn" aria-label="返回" onclick="history.back()"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15.5 4 7.5 12l8 8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
    <h1>海灯节签到</h1>
    <button class="icon-btn" id="share" aria-label="分享"><svg width="23" height="23" viewBox="0 0 24 24" fill="none"><circle cx="18" cy="5" r="2.2" stroke="currentColor"></circle><circle cx="6" cy="12" r="2.2" stroke="currentColor"></circle><circle cx="18" cy="19" r="2.2" stroke="currentColor"></circle><path d="m8 11 8-5M8 13l8 5" stroke="currentColor" stroke-width="1.4"></path></svg></button>
  </header>
  <section class="hero"><p class="kicker">海灯寄愿 · 璃月同辉</p><h2>签到7天<br>送纠缠之缘</h2><p class="subtitle">每日签到，点亮属于你的海灯</p><div class="countdown">距活动结束 <strong id="timer">03天05时18分18秒</strong></div></section>
  <section class="content"><div class="status"><span>七日签到之礼</span><b>已连续签到 <i id="progress">2</i>/7天</b></div>
    <div class="rewards-shell"><div class="rewards" id="rewards"><article class="card done" data-day="1"><div class="day">第1天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><path d="M30 3 49 21 30 57 11 21Z" fill="#9eeaf2" stroke="#e8ffff" stroke-width="2"></path><path d="m30 3 7 20-7 34-7-34Z" fill="#d8ffff" opacity=".8"></path><path d="m11 21 12 2 7 34M49 21l-12 2-7 34" fill="none" stroke="#78bdcf"></path></svg></div><div class="reward-name">原石</div><div class="quantity">×60</div><span class="check">✓</span></article><article class="card done" data-day="2"><div class="day">第2天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="23" fill="#e2ad4d" stroke="#ffe8a0" stroke-width="3"></circle><circle cx="30" cy="30" r="16" fill="none" stroke="#9c682a" stroke-width="2"></circle><path d="m30 17 4 9 10 4-10 4-4 9-4-9-10-4 10-4Z" fill="#fff0a7"></path></svg></div><div class="reward-name">摩拉</div><div class="quantity">×20000</div><span class="check">✓</span></article><article class="card" data-day="3"><div class="day">第3天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><path d="M13 9h31a4 4 0 0 1 4 4v39H17a5 5 0 0 1-5-5V10Z" fill="#8e5faf" stroke="#e8d4ff" stroke-width="2"></path><path d="M18 9v43M23 22h18M23 28h14" stroke="#f0ddff" stroke-width="2"></path><path d="m37 38 3 3 6-7" fill="none" stroke="#ffd995" stroke-width="2"></path></svg></div><div class="reward-name">大英雄的经验</div><div class="quantity">×5</div><span class="check">✓</span></article><article class="card" data-day="4"><div class="day">第4天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><path d="M30 3 49 21 30 57 11 21Z" fill="#9eeaf2" stroke="#e8ffff" stroke-width="2"></path><path d="m30 3 7 20-7 34-7-34Z" fill="#d8ffff" opacity=".8"></path><path d="m11 21 12 2 7 34M49 21l-12 2-7 34" fill="none" stroke="#78bdcf"></path></svg></div><div class="reward-name">原石</div><div class="quantity">×60</div><span class="check">✓</span></article><article class="card" data-day="5"><div class="day">第5天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><path d="m7 35 11-21 15 4 12-7 9 24-13 17-25-3Z" fill="#92bfdd" stroke="#e0f8ff" stroke-width="2"></path><path d="m18 14 7 20 16 18M33 18l-8 16L7 35M25 34l29 1" fill="none" stroke="#d8f5ff" opacity=".7"></path></svg></div><div class="reward-name">精锻用魔矿</div><div class="quantity">×5</div><span class="check">✓</span></article><article class="card" data-day="6"><div class="day">第6天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><path d="M30 3 49 21 30 57 11 21Z" fill="#9eeaf2" stroke="#e8ffff" stroke-width="2"></path><path d="m30 3 7 20-7 34-7-34Z" fill="#d8ffff" opacity=".8"></path><path d="m11 21 12 2 7 34M49 21l-12 2-7 34" fill="none" stroke="#78bdcf"></path></svg></div><div class="reward-name">原石</div><div class="quantity">×60</div><span class="check">✓</span></article><article class="card" data-day="7"><div class="day">第7天</div><div class="reward-icon"><svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="#d8c9ee" stroke="#fff4ff" stroke-width="2"></circle><path d="M30 6c3 13 11 21 24 24-13 3-21 11-24 24-3-13-11-21-24-24C19 27 27 19 30 6Z" fill="#f2bfc4"></path><circle cx="30" cy="30" r="8" fill="#8f79b8" stroke="#fff" stroke-width="2"></circle></svg></div><div class="reward-name">纠缠之缘</div><div class="quantity">×1</div><span class="check">✓</span></article></div></div>
    <p class="hint">左右滑动查看全部签到奖励</p>
    <div class="rules"><strong>活动说明</strong>活动期间每日登录并完成签到即可领取对应奖励。漏签不会重置连续天数，所有奖励仅可领取一次。</div>
  </section>
  <div class="bottom"><button class="checkin" id="checkin">今日签到</button></div><div class="toast" id="toast">签到成功，奖励已发放</div>
</main>
<script>
  const gifts=[['原石','60','gem'],['摩拉','20000','coin'],['大英雄的经验','5','book'],['原石','60','gem'],['精锻用魔矿','5','ore'],['原石','60','gem'],['纠缠之缘','1','fate']];
  const icons={gem:'<svg viewBox="0 0 60 60"><path d="M30 3 49 21 30 57 11 21Z" fill="#9eeaf2" stroke="#e8ffff" stroke-width="2"/><path d="m30 3 7 20-7 34-7-34Z" fill="#d8ffff" opacity=".8"/><path d="m11 21 12 2 7 34M49 21l-12 2-7 34" fill="none" stroke="#78bdcf"/></svg>',coin:'<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="23" fill="#e2ad4d" stroke="#ffe8a0" stroke-width="3"/><circle cx="30" cy="30" r="16" fill="none" stroke="#9c682a" stroke-width="2"/><path d="m30 17 4 9 10 4-10 4-4 9-4-9-10-4 10-4Z" fill="#fff0a7"/></svg>',book:'<svg viewBox="0 0 60 60"><path d="M13 9h31a4 4 0 0 1 4 4v39H17a5 5 0 0 1-5-5V10Z" fill="#8e5faf" stroke="#e8d4ff" stroke-width="2"/><path d="M18 9v43M23 22h18M23 28h14" stroke="#f0ddff" stroke-width="2"/><path d="m37 38 3 3 6-7" fill="none" stroke="#ffd995" stroke-width="2"/></svg>',ore:'<svg viewBox="0 0 60 60"><path d="m7 35 11-21 15 4 12-7 9 24-13 17-25-3Z" fill="#92bfdd" stroke="#e0f8ff" stroke-width="2"/><path d="m18 14 7 20 16 18M33 18l-8 16L7 35M25 34l29 1" fill="none" stroke="#d8f5ff" opacity=".7"/></svg>',fate:'<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="22" fill="#d8c9ee" stroke="#fff4ff" stroke-width="2"/><path d="M30 6c3 13 11 21 24 24-13 3-21 11-24 24-3-13-11-21-24-24C19 27 27 19 30 6Z" fill="#f2bfc4"/><circle cx="30" cy="30" r="8" fill="#8f79b8" stroke="#fff" stroke-width="2"/></svg>'};
  const rewards=document.querySelector('#rewards');
  gifts.forEach((g,i)=>{const card=document.createElement('article');card.className='card'+(i<2?' done':'');card.dataset.day=i+1;card.innerHTML=`<div class="day">第${i+1}天</div><div class="reward-icon">${icons[g[2]]}</div><div class="reward-name">${g[0]}</div><div class="quantity">×${g[1]}</div><span class="check">✓</span>`;rewards.append(card)});
  let seconds=3*86400+5*3600+19*60+43,signed=false;
  const pad=n=>String(n).padStart(2,'0');
  function tick(){seconds=Math.max(0,seconds-1);const d=Math.floor(seconds/86400),h=Math.floor(seconds%86400/3600),m=Math.floor(seconds%3600/60),s=seconds%60;document.querySelector('#timer').textContent=`${pad(d)}天${pad(h)}时${pad(m)}分${pad(s)}秒`}
  setInterval(tick,1000);
  document.querySelector('#checkin').addEventListener('click',e=>{if(signed)return;signed=true;const third=document.querySelector('[data-day="3"]');third.classList.add('today');document.querySelector('#progress').textContent='3';e.currentTarget.textContent='已签到';e.currentTarget.disabled=true;const t=document.querySelector('#toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);third.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});
  document.querySelector('#share').addEventListener('click',async()=>{const data={title:'海灯节签到',text:'签到7天送纠缠之缘'};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(location.href);const t=document.querySelector('#toast');t.textContent='链接已复制';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}}catch{}});
</script>

</body></html>
